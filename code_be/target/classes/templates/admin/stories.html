<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Truyện - TruyenHay</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .mgmt-container {
            padding: 2rem 0;
        }
        .mgmt-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            overflow: hidden;
            margin-bottom: 2rem;
        }
        .mgmt-header {
            padding: 1.5rem 2rem;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .mgmt-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .search-area {
            display: flex;
            gap: 0.5rem;
            flex-grow: 1;
            max-width: 400px;
        }
        .search-input {
            flex-grow: 1;
            padding: 0.5rem 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            outline: none;
        }
        .search-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }
        .data-table th {
            text-align: left;
            padding: 1rem 1.5rem;
            background: #f1f5f9;
            color: #475569;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }
        .data-table td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: middle;
        }
        .story-cell {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .story-cover {
            width: 45px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
            background: #f1f5f9;
        }
        .story-title {
            font-weight: 600;
            color: #1e293b;
            text-decoration: none;
        }
        .story-title:hover {
            color: #3b82f6;
        }
        .uploader-info {
            font-size: 0.85rem;
            color: #64748b;
        }
        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-visible { background: #dcfce7; color: #166534; }
        .status-hidden { background: #f1f5f9; color: #475569; }
        
        .btn-action {
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .btn-hide { background: #eff6ff; color: #2563eb; }
        .btn-hide:hover { background: #dbeafe; }
        .btn-delete { background: #fff1f2; color: #e11d48; }
        .btn-delete:hover { background: #ffe4e6; }
        
        .pagination {
            display: flex;
            justify-content: center;
            padding: 1.5rem;
            gap: 0.5rem;
        }
        .page-link {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            color: #475569;
            text-decoration: none;
            transition: all 0.2s;
        }
        .page-link:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }
        .page-link.active {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }
    </style>
</head>
<body class="bg-slate-50">
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    
    <main class="container mgmt-container">
        <div class="mgmt-card">
            <div class="mgmt-header">
                <h1 class="mgmt-title"><i class="fas fa-book"></i> Quản lý Truyện</h1>
                
                <form th:action="@{/admin/stories}" method="get" class="search-area">
                    <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm tên truyện..." class="search-input">
                    <button type="submit" class="btn btn-primary"><i class="fas fa-search"></i></button>
                </form>
            </div>
            
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Truyện</th>
                        <th>Người đăng</th>
                        <th>Lượt đọc</th>
                        <th>Trạng thái</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="story : ${stories.content}">
                        <td>
                            <div class="story-cell">
                                <img th:if="${story.coverImage}" th:src="${story.coverImage}" class="story-cover" alt="Cover">
                                <div th:unless="${story.coverImage}" class="story-cover flex items-center justify-center text-slate-400"><i class="fas fa-image"></i></div>
                                <div>
                                    <a th:href="@{/story/{slug}(slug=${story.slug})}" class="story-title" th:text="${story.title}" target="_blank">Title</a>
                                    <div class="uploader-info" th:text="${story.author}">Tác giả</div>
                                </div>
                            </div>
                        </td>
                        <td>
                            <span th:text="${story.uploader != null ? story.uploader.username : 'Hệ thống'}">Uploader</span>
                        </td>
                        <td th:text="${story.views}">0</td>
                        <td>
                            <span th:if="${!story.hidden}" class="status-badge status-visible">
                                <i class="fas fa-eye"></i> Hiện
                            </span>
                            <span th:if="${story.hidden}" class="status-badge status-hidden">
                                <i class="fas fa-eye-slash"></i> Ẩn
                            </span>
                        </td>
                        <td>
                            <div class="flex gap-2">
                                <form th:action="@{/admin/stories/toggle-visibility/{id}(id=${story.id})}" method="post" style="display:inline;">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <button type="submit" class="btn-action btn-hide" th:title="${story.hidden ? 'Hiện truyện' : 'Ẩn truyện'}">
                                        <i th:class="${story.hidden ? 'fas fa-eye' : 'fas fa-eye-slash'}"></i>
                                        <span th:text="${story.hidden ? 'Hiện' : 'Ẩn'}"></span>
                                    </button>
                                </form>
                                <form th:action="@{/admin/stories/delete/{id}(id=${story.id})}" method="post" style="display:inline;"
                                      onsubmit="return confirm('CẢNH BÁO: Hành động này sẽ xóa vĩnh viễn truyện và TOÀN BỘ dữ liệu liên quan (chương, bình luận, đánh giá...). Bạn có chắc chắn?')">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <button type="submit" class="btn-action btn-delete" title="Xóa vĩnh viễn">
                                        <i class="fas fa-trash"></i> Xóa
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${stories.isEmpty()}">
                        <td colspan="5" style="text-align: center; padding: 3rem; color: #64748b;">
                            <i class="fas fa-box-open fa-3x" style="margin-bottom: 1rem; opacity: 0.3;"></i>
                            <p>Không tìm thấy truyện nào.</p>
                        </td>
                    </tr>
                </tbody>
            </table>
            
            <!-- Pagination -->
            <div th:if="${stories.totalPages > 1}" class="pagination">
                <a th:each="i : ${#numbers.sequence(0, stories.totalPages - 1)}" 
                   th:href="@{/admin/stories(page=${i}, keyword=${keyword})}"
                   class="page-link" 
                   th:classappend="${stories.number == i} ? 'active'"
                   th:text="${i + 1}">1</a>
            </div>
        </div>
    </main>
</body>
</html>
