<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Người dùng - TruyenHay</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .user-mgmt-container {
            padding: 2rem 0;
        }
        .mgmt-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            overflow: hidden;
            margin-bottom: 2rem;
        }
        .mgmt-header {
            padding: 1.5rem 2rem;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .mgmt-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .user-table {
            width: 100%;
            border-collapse: collapse;
        }
        .user-table th {
            text-align: left;
            padding: 1rem 1.5rem;
            background: #f1f5f9;
            color: #475569;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }
        .user-table td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: middle;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            object-fit: cover;
        }
        .username {
            font-weight: 600;
            color: #1e293b;
        }
        .email {
            font-size: 0.85rem;
            color: #64748b;
        }
        .role-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-right: 0.25rem;
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #e2e8f0;
        }
        .role-ADMIN { background: #fee2e2; color: #991b1b; border-color: #fecaca; }
        .role-UPLOADER { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
        .role-MOD { background: #fef9c3; color: #854d0e; border-color: #fef08a; }

        .status-toggle {
            cursor: pointer;
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            border: none;
            transition: all 0.2s;
        }
        .status-active { background: #ecfdf5; color: #059669; }
        .status-inactive { background: #fef2f2; color: #dc2626; }
        
        .btn-action {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }
        .btn-edit { background: #eff6ff; color: #2563eb; }
        .btn-edit:hover { background: #dbeafe; }
        .btn-delete { background: #fff1f2; color: #e11d48; }
        .btn-delete:hover { background: #ffe4e6; }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            width: 450px;
            max-width: 90%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .form-group { margin-bottom: 1.25rem; }
        .form-label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #334155; }
        .form-input { width: 100%; padding: 0.6rem; border: 1px solid #cbd5e1; border-radius: 6px; }
    </style>
</head>
<body class="bg-slate-50">
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    
    <main class="container user-mgmt-container">
        <!-- Success/Error Alerts -->
        <div th:if="${successMessage}" class="alert alert-success" style="padding:1rem; background:#dcfce7; color:#166534; border-radius:8px; margin-bottom:1.5rem; border-left:4px solid #22c55e;">
            <i class="fas fa-check-circle"></i> <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-error" style="padding:1rem; background:#fef2f2; color:#991b1b; border-radius:8px; margin-bottom:1.5rem; border-left:4px solid #ef4444;">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
        </div>

        <div class="mgmt-card">
            <div class="mgmt-header">
                <h1 class="mgmt-title"><i class="fas fa-users"></i> Quản lý Người dùng</h1>
                <button class="btn btn-primary" onclick="openCreateModal()">
                    <i class="fas fa-plus"></i> Thêm Người dùng
                </button>
            </div>
            
            <table class="user-table">
                <thead>
                    <tr>
                        <th>Người dùng</th>
                        <th>Quyền (Roles)</th>
                        <th>Trạng thái</th>
                        <th>Ngày tạo</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td>
                            <div class="user-info">
                                <img th:if="${user.avatar}" th:src="${user.avatar}" class="user-avatar" alt="Avatar">
                                <div th:unless="${user.avatar}" class="user-avatar" th:text="${#strings.substring(user.username,0,1).toUpperCase()}">U</div>
                                <div>
                                    <div class="username" th:text="${user.username}">username</div>
                                    <div class="email" th:text="${user.email}">email@example.com</div>
                                </div>
                            </div>
                        </td>
                        <td>
                            <span th:each="role : ${user.roles}" 
                                  class="role-badge" 
                                  th:classappend="'role-' + ${role.name.replace('ROLE_','')}"
                                  th:text="${role.name.replace('ROLE_','')}">ROLE</span>
                        </td>
                        <td>
                            <form th:action="@{/admin/users/{id}/toggle-status(id=${user.id})}" method="post" style="display:inline;">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit" 
                                        class="status-toggle" 
                                        th:classappend="${user.enabled} ? 'status-active' : 'status-inactive'">
                                    <i th:class="${user.enabled} ? 'fas fa-check-circle' : 'fas fa-ban'"></i>
                                    <span th:text="${user.enabled} ? 'Hoạt động' : 'Bị khóa'"></span>
                                </button>
                            </form>
                        </td>
                        <td th:text="${#temporals.format(user.createdAt, 'dd/MM/yyyy')}">01/01/2026</td>
                        <td>
                            <div class="flex gap-2">
                                <button class="btn-action btn-edit" th:onclick="'openEditModal(' + ${user.id} + ')'" title="Sửa quyền">
                                    <i class="fas fa-user-shield"></i>
                                </button>
                                <form th:if="${user.username != #authentication.name}" 
                                      th:action="@{/admin/users/{id}/delete(id=${user.id})}" 
                                      method="post" 
                                      style="display:inline;"
                                      onsubmit="return confirm('Bạn có chắc chắn muốn xóa người dùng này?')">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <button type="submit" class="btn-action btn-delete" title="Xóa">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Create User Modal -->
    <div id="createModal" class="modal">
        <div class="modal-content">
            <h2 style="margin-bottom:1.5rem;">Thêm Người dùng mới</h2>
            <form th:action="@{/admin/users/create}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="form-group">
                    <label class="form-label">Tên đăng nhập</label>
                    <input type="text" name="username" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" name="password" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Quyền hạn</label>
                    <div th:each="role : ${allRoles}" style="margin-bottom:0.5rem;">
                        <input type="checkbox" name="roleIds" th:value="${role.id}" th:id="'role-' + ${role.id}">
                        <label th:for="'role-' + ${role.id}" th:text="${role.name}"></label>
                    </div>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:1rem; margin-top:2rem;">
                    <button type="button" class="btn" onclick="closeModals()">Hủy</button>
                    <button type="submit" class="btn btn-primary">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Roles Modal (Simplified) -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h2 style="margin-bottom:1.5rem;">Cập nhật Quyền hạn</h2>
            <form id="editForm" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="form-group">
                    <label class="form-label">Chọn các quyền cho người dùng này:</label>
                    <div th:each="role : ${allRoles}" style="margin-bottom:0.5rem;">
                        <input type="checkbox" name="roleIds" th:value="${role.id}" th:id="'edit-role-' + ${role.id}">
                        <label th:for="'edit-role-' + ${role.id}" th:text="${role.name}"></label>
                    </div>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:1rem; margin-top:2rem;">
                    <button type="button" class="btn" onclick="closeModals()">Hủy</button>
                    <button type="submit" class="btn btn-primary">Cập nhật</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function openCreateModal() {
            document.getElementById('createModal').style.display = 'flex';
        }
        function openEditModal(userId) {
            const modal = document.getElementById('editModal');
            const form = document.getElementById('editForm');
            form.action = '/admin/users/' + userId + '/update-roles';
            modal.style.display = 'flex';
            // Note: In a real app, you'd fetch current roles via AJAX and check the boxes.
            // For MVP, we'll let admin check/uncheck roles from scratch.
        }
        function closeModals() {
            document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
        }
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) closeModals();
        }
    </script>
</body>
</html>
