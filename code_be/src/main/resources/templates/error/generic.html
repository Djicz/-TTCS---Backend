<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${errorTitle ?: 'Lỗi'} + ' - TruyenHay'">Lỗi</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background:#f8fafc; display:flex; flex-direction:column; min-height:100vh; }
        .error-page { flex:1; display:flex; align-items:center; justify-content:center; padding:3rem 1rem; }
        .error-box { text-align:center; max-width:480px; }
        .error-icon { font-size:4rem; margin-bottom:1.5rem; }
        .error-code { font-size:5rem; font-weight:800; color:#e2e8f0; line-height:1; margin-bottom:0.5rem; }
        .error-title { font-size:1.5rem; font-weight:700; color:#0f172a; margin-bottom:0.75rem; }
        .error-msg { font-size:0.95rem; color:#64748b; margin-bottom:2rem; line-height:1.6; }
        .btn-home {
            display:inline-flex; align-items:center; gap:0.5rem;
            background:linear-gradient(135deg,#667eea,#764ba2);
            color:white; padding:0.75rem 1.5rem; border-radius:10px;
            font-weight:600; text-decoration:none;
            box-shadow:0 4px 12px rgba(102,126,234,0.3);
            transition:transform 0.15s;
        }
        .btn-home:hover { transform:translateY(-2px); }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-content">
            <a th:href="@{/}" class="logo logo-special">
                <span class="logo-text-main">Truyen</span><span class="logo-text-accent">Hay</span>
            </a>
        </div>
    </nav>
    <div class="error-page">
        <div class="error-box">
            <div class="error-icon">⚠️</div>
            <div class="error-code">Oops</div>
            <h1 class="error-title" th:text="${errorTitle ?: 'Đã xảy ra lỗi'}">Lỗi</h1>
            <p class="error-msg" th:text="${errorMessage ?: 'Trang bạn tìm kiếm không tồn tại hoặc bạn không có quyền truy cập.'}">
                Đã xảy ra lỗi.
            </p>
            <a th:href="@{/}" class="btn-home"><i class="fas fa-home"></i> Về trang chủ</a>
            <a href="javascript:history.back()" class="btn-home" style="background:linear-gradient(135deg,#94a3b8,#64748b); margin-left:0.5rem;">
                <i class="fas fa-arrow-left"></i> Quay lại
            </a>
        </div>
    </div>
</body>
</html>
