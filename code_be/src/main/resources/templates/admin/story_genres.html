<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Gán Thể Loại — ' + ${story.title} + ' - TruyenHay'">Gán Thể Loại</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v=2)}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #f8faff; }

        .page-header {
            background: linear-gradient(135deg, #1e3a5f 0%, #312e81 100%);
            padding: 2.5rem 0 3rem;
            margin-bottom: -2rem;
        }
        .page-header h1 { color: white; font-size: 1.5rem; font-weight: 800; margin: 0; }
        .page-header p  { color: rgba(255,255,255,0.65); margin: 0.3rem 0 0; font-size: 0.9rem; }

        .assign-card {
            background: white; border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            max-width: 760px; margin: 3rem auto 4rem;
            overflow: hidden;
        }
        .assign-header {
            padding: 1.25rem 1.75rem;
            border-bottom: 1px solid #f1f5f9;
            background: #fafbff;
            display: flex; align-items: center; gap: 0.6rem;
        }
        .assign-header h2 { font-size: 1rem; font-weight: 700; color: #1e293b; margin: 0; }
        .assign-header i { color: #7c3aed; }

        .story-info-bar {
            display: flex; align-items: center; gap: 1rem;
            padding: 1.25rem 1.75rem;
            background: linear-gradient(135deg, #ede9fe20, #dbeafe20);
            border-bottom: 1px solid #f1f5f9;
        }
        .story-cover-sm {
            width: 60px; height: 80px; object-fit: cover;
            border-radius: 8px; border: 1px solid #e2e8f0;
            flex-shrink: 0;
        }
        .story-cover-placeholder {
            width: 60px; height: 80px;
            background: linear-gradient(135deg, #e2e8f0, #ddd6fe);
            border-radius: 8px; display: flex; align-items: center;
            justify-content: center; color: #94a3b8; flex-shrink: 0;
        }
        .story-name { font-size: 1.1rem; font-weight: 700; color: #1e293b; }
        .story-author { font-size: 0.85rem; color: #64748b; margin-top: 2px; }

        /* Genre checkbox grid */
        .genre-grid {
            padding: 1.75rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 0.75rem;
        }
        .genre-check-label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.75rem 1rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.875rem;
            font-weight: 500;
            color: #374151;
            user-select: none;
            background: white;
        }
        .genre-check-label:hover {
            border-color: #c4b5fd;
            background: #faf5ff;
        }
        .genre-check-label input[type="checkbox"] {
            accent-color: #7c3aed;
            width: 16px; height: 16px;
            flex-shrink: 0;
        }
        .genre-check-label.checked {
            border-color: #7c3aed;
            background: linear-gradient(135deg, #ede9fe, #dbeafe);
            color: #5b21b6;
            font-weight: 700;
        }

        .form-footer {
            padding: 1.25rem 1.75rem;
            border-top: 1px solid #f1f5f9;
            background: #fafbff;
            display: flex; align-items: center; gap: 0.75rem;
        }
        .btn-submit {
            display: inline-flex; align-items: center; gap: 0.45rem;
            background: linear-gradient(135deg, #7c3aed, #3b82f6);
            color: white; padding: 0.7rem 1.5rem;
            border-radius: 9px; border: none; cursor: pointer;
            font-weight: 700; font-size: 0.9rem;
            transition: opacity 0.2s, transform 0.15s;
            box-shadow: 0 4px 12px rgba(124,58,237,0.25);
        }
        .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-cancel {
            color: #64748b; text-decoration: none; font-size: 0.9rem;
            font-weight: 500; padding: 0.7rem 1rem; border-radius: 9px;
            transition: background 0.15s;
        }
        .btn-cancel:hover { background: #f1f5f9; }

        .selected-count {
            margin-left: auto; font-size: 0.8rem; color: #7c3aed;
            font-weight: 600; background: #ede9fe;
            padding: 0.25rem 0.75rem; border-radius: 6px;
        }
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container nav-content">
            <a th:href="@{/}" class="logo logo-special">
                <span class="logo-text-main">Truyen</span><span class="logo-text-accent">Hay</span>
            </a>
            <div class="nav-links flex items-center gap-4">
                <a th:href="@{/}">Trang chủ</a>
                <a th:href="@{/stories}">Tìm Truyện</a>
                <a th:href="@{/admin/genres}" style="color:#7c3aed; font-weight:700;">
                    <i class="fas fa-tags" style="margin-right:4px;"></i>Quản lý Thể Loại
                </a>
                <div class="user-dropdown" th:if="${username != null}">
                    <span style="color:#2d3748; font-weight:600; padding:0.5rem;" th:text="${username}"></span>
                    <div class="dropdown-content">
                        <a th:href="@{/profile}" class="dropdown-item"><i class="fas fa-user-circle"></i> Hồ sơ</a>
                        <div class="dropdown-divider"></div>
                        <form th:action="@{/logout}" method="post" style="margin:0;">
                            <button type="submit" class="btn-logout-dropdown"><i class="fas fa-sign-out-alt"></i> Đăng xuất</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- HEADER -->
    <div class="page-header">
        <div class="container">
            <h1><i class="fas fa-tags" style="margin-right:0.5rem;"></i>Gán Thể Loại</h1>
            <p>Admin / Mod — Chọn thể loại cho truyện bên dưới</p>
        </div>
    </div>

    <div class="container">
        <div class="assign-card">
            <div class="assign-header">
                <i class="fas fa-book"></i>
                <h2>Chọn thể loại cho truyện</h2>
            </div>

            <!-- Story Info -->
            <div class="story-info-bar">
                <img th:if="${story.coverImage}" th:src="${story.coverImage}"
                     class="story-cover-sm" alt="Cover">
                <div th:unless="${story.coverImage}" class="story-cover-placeholder">
                    <i class="fas fa-book"></i>
                </div>
                <div>
                    <div class="story-name" th:text="${story.title}">Tên truyện</div>
                    <div class="story-author">
                        <i class="fas fa-pen-nib" style="margin-right:3px;"></i>
                        <span th:text="${story.author}">Tác giả</span>
                    </div>
                </div>
            </div>

            <form th:action="@{/admin/genres/story/{id}(id=${story.id})}" method="post">
                <!-- Genre checkboxes -->
                <div class="genre-grid" id="genreGrid">
                    <label th:each="genre : ${allGenres}"
                           class="genre-check-label"
                           th:classappend="${story.genres.contains(genre)} ? ' checked' : ''">
                        <input type="checkbox"
                               name="genreIds"
                               th:value="${genre.id}"
                               th:checked="${story.genres.contains(genre)}"
                               onchange="updateLabel(this)">
                        <i class="fas fa-tag" style="font-size:0.75rem; opacity:0.7;"></i>
                        <span th:text="${genre.name}">Thể loại</span>
                    </label>
                </div>

                <div class="form-footer">
                    <button type="submit" class="btn-submit">
                        <i class="fas fa-save"></i> Lưu thể loại
                    </button>
                    <a th:href="@{/story/{slug}(slug=${story.slug})}" class="btn-cancel">
                        <i class="fas fa-times" style="margin-right:4px;"></i>Hủy
                    </a>
                    <div class="selected-count" id="selectedCount">0 đã chọn</div>
                </div>
            </form>
        </div>
    </div>

    <script>
        function updateLabel(checkbox) {
            const label = checkbox.closest('.genre-check-label');
            if (checkbox.checked) {
                label.classList.add('checked');
            } else {
                label.classList.remove('checked');
            }
            updateCount();
        }
        function updateCount() {
            const count = document.querySelectorAll('#genreGrid input[type="checkbox"]:checked').length;
            document.getElementById('selectedCount').textContent = count + ' đã chọn';
        }
        document.addEventListener('DOMContentLoaded', updateCount);
    </script>
</body>
</html>
