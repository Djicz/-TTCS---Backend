<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Báo Hệ Thống - WebDocTruyen</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="background: #f8fafc;">
    <nav class="navbar" th:replace="~{index :: .navbar}"></nav>
    <div class="container" style="padding: 2rem 1rem; max-width: 900px; margin: 0 auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h2 style="margin: 0; color: #1e293b; font-size: 1.5rem;"><i class="fas fa-bell" style="color: #ef4444;"></i> Thông Báo Hệ Thống (Trang Admin)</h2>
        </div>
        
        <div style="background: white; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
            <div th:if="${#lists.isEmpty(notifications)}" style="padding: 3rem; text-align: center; color: #64748b;">
                Hệ thống hiện chưa có thông báo nào.
            </div>
            
            <div th:each="notif : ${notifications}" style="padding: 1.5rem; border-bottom: 1px solid #f1f5f9; display: flex; gap: 1rem; align-items: flex-start; transition: background 0.2s;" th:styleappend="${notif.isRead} ? 'background: white;' : 'background: #f8fafc; border-left: 4px solid #ef4444;'">
                
                <div style="background: #fee2e2; color: #ef4444; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 1.25rem;" th:if="${notif.type == 'REPORT'}">
                    <i class="fas fa-flag"></i>
                </div>
                <!-- Dành cho các loại notification khác ngoài REPORT, mặc định: -->
                <div style="background: #e0e7ff; color: #4f46e5; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 1.25rem;" th:unless="${notif.type == 'REPORT'}">
                    <i class="fas fa-info-circle"></i>
                </div>

                <div style="flex-grow: 1;">
                    <div style="font-size: 1rem; color: #1e293b; line-height: 1.5; margin-bottom: 0.5rem;" th:text="${notif.content}">Nội dung thông báo</div>
                    <div style="font-size: 0.8rem; color: #94a3b8; display: flex; align-items: center; gap: 0.5rem;">
                        <i class="far fa-clock"></i> <span th:text="${#temporals.format(notif.createdAt, 'dd/MM/yyyy HH:mm:ss')}">Thời gian</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
