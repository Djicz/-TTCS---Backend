<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${story.title} + ' - WebDocTruyen'"></title>
    <link rel="stylesheet" th:href="@{/css/style.css(v=2)}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .story-header {
            display: flex;
            gap: 3rem;
            margin-bottom: 3rem;
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid #f1f5f9;
        }

        @media (max-width: 768px) {
            .story-header {
                flex-direction: column;
                padding: 1.5rem;
                gap: 1.5rem;
            }
        }

        .story-cover-large {
            width: 280px;
            height: 400px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            background-color: var(--border-color);
            flex-shrink: 0;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .story-cover-large:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
        }

        .story-details {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .story-details h1 {
            font-size: 2.25rem;
            font-weight: 800;
            margin-bottom: 1rem;
            color: #1e293b;
            line-height: 1.2;
        }

        .meta-badges {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .badge {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            padding: 0.35rem 1rem;
            border-radius: 999px;
            font-size: 0.875rem;
            font-weight: 600;
            color: #475569;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }

        .badge-status {
            background: #dbeafe;
            color: #1d4ed8;
            border-color: #bfdbfe;
        }

        .story-desc {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #475569;
            margin-bottom: 2rem;
            flex-grow: 1;
        }

        /* Animated Buttons */
        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: auto;
            flex-wrap: wrap;
        }

        .btn-animated {
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            text-decoration: none;
            cursor: pointer;
            border: none;
        }

        .btn-read {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3);
        }

        .btn-read:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4);
            color: white;
            /* Ensure text stays white */
        }

        .btn-read:active {
            transform: translateY(0);
        }

        .btn-outline {
            background-color: transparent;
            color: #475569;
            border: 2px solid #cbd5e1;
        }

        .btn-outline:hover {
            border-color: #3b82f6;
            color: #3b82f6;
            transform: translateY(-2px);
            background-color: #eff6ff;
        }

        /* Chapter List */
        .chapter-list {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #f1f5f9;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
            overflow: hidden;
            margin-bottom: 3rem;
        }

        .chapter-header {
            padding: 1.25rem 2rem;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            font-weight: 700;
            font-size: 1.1rem;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .chapter-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            border-bottom: 1px solid #f1f5f9;
            transition: all 0.2s;
            color: #334155;
            text-decoration: none;
            font-weight: 500;
        }

        .chapter-item:last-child {
            border-bottom: none;
        }

        .chapter-item:hover {
            background-color: #f8fafc;
            color: #2563eb;
            padding-left: 2.25rem;
            /* Slight indent animation */
        }
    </style>
</head>

<body>
    <nav class="navbar" th:replace="~{index :: .navbar}"></nav>
    <div class="container" style="padding: 2rem 1rem;">
        <div class="story-header">
            <img th:if="${story.coverImage}" th:src="${story.coverImage}" class="story-cover-large" alt="Cover">
            <div th:unless="${story.coverImage}" class="story-cover-large flex items-center justify-center">
                <span style="color: #94a3b8; font-weight: 500;">Chưa có ảnh bìa</span>
            </div>
            <div class="story-details">
                <h1 th:text="${story.title}">Tên Truyện</h1>
                <div class="meta-badges">
                    <span class="badge"><i class="fas fa-pen-nib" style="color:#64748b;"></i> <span
                            th:text="${story.author}">Tác giả</span></span>
                    <span class="badge badge-status" th:text="${story.status}">ONGOING</span>
                    <span class="badge"><i class="fas fa-eye" style="color:#64748b;"></i> Lượt xem: <span
                            th:text="${story.views}">0</span></span>
                    <span class="badge" style="color: #ea580c; border-color: #ffedd5; background: #fff7ed;"><i
                            class="fas fa-star"></i> <span th:text="${story.averageRating}">0.0</span></span>
                    <span class="badge" style="color: #10b981; border-color: #d1fae5; background: #ecfdf5;"><i
                            class="fas fa-thumbs-up"></i> Đề cử: <span id="nominationCount"
                            th:text="${story.nominations != null ? story.nominations : 0}">0</span></span>
                </div>
                <div class="story-desc" th:utext="${story.description}">
                    Mô tả truyện...
                </div>
                <div class="action-buttons">
                    <a th:if="${not #lists.isEmpty(chapters) and #authorization.expression('isAuthenticated()')}"
                        th:href="@{/reader/{chapterId}(chapterId=${chapters[0].id})}" class="btn-animated btn-read">
                        <i class="fas fa-book-open"></i> Đọc Từ Đầu
                    </a>
                    <a th:if="${not #lists.isEmpty(chapters) and !#authorization.expression('isAuthenticated()')}"
                        th:href="@{/login}" class="btn-animated btn-read">
                        <i class="fas fa-lock"></i> Đăng nhập để đọc
                    </a>
                    <a th:if="${#lists.isEmpty(chapters)}" href="#" class="btn-animated btn-read"
                        style="opacity: 0.5; pointer-events: none;">
                        <i class="fas fa-lock"></i> Chưa có chương
                    </a>
                    <form th:if="${#authorization.expression('isAuthenticated()')}" th:action="@{/bookshelf/add}"
                        method="post">
                        <input type="hidden" name="storyId" th:value="${story.id}">
                        <button type="submit" class="btn-animated btn-outline">
                            <i class="fas fa-bookmark"></i> Thêm Vào Tủ Sách
                        </button>
                    </form>
                    <button th:if="${#authorization.expression('isAuthenticated()')}" type="button"
                        class="btn-animated btn-outline" onclick="nominateStory()"
                        style="color: #10b981; border-color: #10b981;">
                        <i class="fas fa-thumbs-up"></i> Đề Cử
                    </button>
                    <!-- Nút Báo Cáo -->
                    <button th:if="${#authorization.expression('isAuthenticated()')}" type="button"
                        class="btn-animated btn-outline" onclick="openReportModal('STORY', storyId)"
                        style="color: #ef4444; border-color: #ef4444;">
                        <i class="fas fa-flag"></i> Báo Cáo
                    </button>
                </div>
            </div>
        </div>
        <div class="chapter-list">
            <div class="chapter-header">
                <i class="fas fa-list-ul" style="color: #3b82f6;"></i> Danh Sách Chương
            </div>
            <div th:if="${#lists.isEmpty(chapters)}"
                style="padding: 3rem; text-align: center; color: #64748b; font-style: italic;">
                Truyện hiện tại chưa có chương nào được đăng tải.
            </div>
            <a th:each="chapter : ${chapters}" 
               th:href="${#authorization.expression('isAuthenticated()')} ? @{/reader/{id}(id=${chapter.id})} : @{/login}" 
               class="chapter-item">
                <span th:text="'Chương ' + ${chapter.chapterNumber} + ': ' + ${chapter.title}">Chương 1</span>
                <span class="badge" th:text="${#temporals.format(chapter.createdAt, 'dd-MM-yyyy')}"
                    style="font-size: 0.75rem; background: transparent; border: none; color: #94a3b8;">01-01-2026</span>
            </a>
        </div>
        
        <!-- Truyện Tương Tự (Similar Stories) -->
        <div th:if="${not #lists.isEmpty(relatedStories)}" style="margin-bottom: 3rem;">
            <div style="font-size: 1.5rem; font-weight: 800; color: #1e293b; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem;">
                <i class="fas fa-heart" style="color: #ef4444;"></i> Có thể bạn sẽ thích
            </div>
            <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.5rem;">
                <a th:each="related : ${relatedStories}" th:href="@{/story/{slug}(slug=${related.slug})}" style="text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 0.75rem; transition: transform 0.2s;" onmouseover="this.style.transform='translateY(-5px)'" onmouseout="this.style.transform='none'">
                    <img th:if="${related.coverImage}" th:src="${related.coverImage}" alt="Cover" style="width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
                    <div th:unless="${related.coverImage}" style="width: 100%; aspect-ratio: 2/3; background: #e2e8f0; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; color: #64748b;">No Cover</div>
                    <div style="font-weight: 600; font-size: 1rem; color: #1e293b; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;" th:text="${related.title}">Tên truyện</div>
                </a>
            </div>
        </div>

        <!-- Modal Báo Cáo -->
        <div id="reportModal" class="modal" tabindex="-1" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
            <div style="background: white; padding: 2rem; border-radius: 12px; width: 90%; max-width: 500px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h3 style="margin: 0; font-size: 1.25rem; font-weight: 700; color: #1e293b;">Báo Cáo Vi Phạm</h3>
                    <button onclick="closeReportModal()" style="background: none; border: none; font-size: 1.25rem; cursor: pointer; color: #64748b;">&times;</button>
                </div>
                <form id="reportForm" onsubmit="submitReport(event)">
                    <input type="hidden" id="reportType">
                    <input type="hidden" id="reportTargetId">
                    <div style="margin-bottom: 1rem;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #475569;">Lý do báo cáo:</label>
                        <select id="reportReason" required style="width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; background: #fff;">
                            <option value="">-- Chọn lý do --</option>
                            <option value="SPAM">Spam, quảng cáo</option>
                            <option value="OFFENSIVE">Nội dung phản cảm, đồi trụy</option>
                            <option value="COPYRIGHT">Vi phạm bản quyền</option>
                            <option value="OTHER">Lý do khác</option>
                        </select>
                    </div>
                    <div style="margin-bottom: 1.5rem;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #475569;">Chi tiết bổ sung:</label>
                        <textarea id="reportContent" rows="3" style="width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; resize: vertical;" placeholder="Nhập chi tiết vi phạm..."></textarea>
                    </div>
                    <div style="display: flex; justify-content: flex-end; gap: 1rem;">
                        <button type="button" onclick="closeReportModal()" style="padding: 0.6rem 1.2rem; background: #f1f5f9; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; color: #475569;">Hủy</button>
                        <button type="submit" style="padding: 0.6rem 1.2rem; background: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">Gửi Báo Cáo</button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <script th:inline="javascript">
        const storyId = /*[[${story.id}]]*/ null;
        function nominateStory() {
            if (!storyId) return;
            fetch(`/api/stories/${storyId}/nominate`, {
                method: 'POST'
            })
                .then(async response => {
                    const data = await response.json();
                    if (response.ok) {
                        document.getElementById('nominationCount').innerText = data;
                        alert('🎉 Đề cử thành công!');
                    } else if (response.status === 401) {
                        alert('Bạn cần đăng nhập để đề cử truyện!');
                    } else if (response.status === 400) {
                        alert('⚠️ ' + (data.error || 'Bạn không có đủ phiếu đề cử! Hãy đọc truyện 10 giây để nhận thêm nhé.'));
                    } else {
                        alert('Có lỗi xảy ra: ' + (data.error || 'Lỗi không xác định'));
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Không thể kết nối tới máy chủ.');
                });
        }

        // JS Báo Cáo
        function openReportModal(type, targetId) {
            document.getElementById('reportType').value = type;
            document.getElementById('reportTargetId').value = targetId;
            document.getElementById('reportReason').value = '';
            document.getElementById('reportContent').value = '';
            const modal = document.getElementById('reportModal');
            modal.style.display = 'flex';
        }

        function closeReportModal() {
            document.getElementById('reportModal').style.display = 'none';
        }

        function submitReport(e) {
            e.preventDefault();
            const type = document.getElementById('reportType').value;
            const targetId = document.getElementById('reportTargetId').value;
            const reason = document.getElementById('reportReason').value;
            const content = document.getElementById('reportContent').value;
            
            fetch('/api/reports', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type, targetId, reason, content })
            })
            .then(async res => {
                const data = await res.json();
                if(res.ok) {
                    alert(data.message || 'Báo cáo thành công');
                    closeReportModal();
                } else {
                    alert(data.message || 'Có lỗi xảy ra');
                }
            })
            .catch(err => alert('Lỗi kết nối'));
        }
    </script>
</body>

</html>
