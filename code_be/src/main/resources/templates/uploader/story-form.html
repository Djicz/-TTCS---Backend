<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Truyện Mới - WebDocTruyen</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="background: #f8fafc;">
    <nav class="navbar" th:replace="~{index :: .navbar}"></nav>
    <div class="container" style="padding: 2rem 1rem; max-width: 800px; margin: 0 auto;">
        <div style="background: white; border-radius: 12px; padding: 2.5rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid #f1f5f9;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 2px solid #f1f5f9; padding-bottom: 1rem;">
                <h2 style="margin: 0; color: #1e293b; font-size: 1.5rem;"><i class="fas fa-book-medical" style="color: #3b82f6;"></i> Đăng Truyện Mới</h2>
                <a th:href="@{/uploader/stories}" style="color: #64748b; text-decoration: none; font-size: 0.9rem;"><i class="fas fa-arrow-left"></i> Quay lại</a>
            </div>

            <form th:action="@{/uploader/stories/new}" th:object="${story}" method="post">
                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; font-weight: 600; color: #475569; margin-bottom: 0.5rem;">Tên Truyện *</label>
                    <input type="text" th:field="*{title}" required placeholder="Ví dụ: Đại Chúa Tể" style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; outline: none; transition: border-color 0.2s;">
                </div>

                <div style="margin-bottom: 1.5rem; display: flex; gap: 1.5rem;">
                    <div style="flex: 1;">
                        <label style="display: block; font-weight: 600; color: #475569; margin-bottom: 0.5rem;">Tác Giả *</label>
                        <input type="text" th:field="*{author}" required placeholder="Tên tác giả" style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; outline: none;">
                    </div>
                    <div style="flex: 1;">
                        <label style="display: block; font-weight: 600; color: #475569; margin-bottom: 0.5rem;">Trạng Thái</label>
                        <select th:field="*{status}" style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; outline: none; background: white;">
                            <option value="ONGOING">Đang ra</option>
                            <option value="COMPLETED">Hoàn thành</option>
                            <option value="PAUSED">Tạm dừng</option>
                        </select>
                    </div>
                </div>

                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; font-weight: 600; color: #475569; margin-bottom: 0.5rem;">Link Ảnh Bìa</label>
                    <input type="url" th:field="*{coverImage}" placeholder="https://..." style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; outline: none;">
                </div>

                <div style="margin-bottom: 2rem;">
                    <label style="display: block; font-weight: 600; color: #475569; margin-bottom: 0.5rem;">Giới Thiệu Truyện *</label>
                    <textarea th:field="*{description}" required rows="6" placeholder="Mô tả nội dung truyện..." style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; outline: none; resize: vertical;"></textarea>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
                    <a th:href="@{/uploader/stories}" class="btn" style="background: white; border: 1px solid #cbd5e1; color: #64748b; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 600;">Hủy</a>
                    <button type="submit" class="btn btn-primary" style="background: #3b82f6; padding: 0.75rem 2rem; border-radius: 8px; font-weight: 600; box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3);">Lưu Truyện</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
