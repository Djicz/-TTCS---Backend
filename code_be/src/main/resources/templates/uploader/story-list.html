<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truyện Của Tôi - WebDocTruyen</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar" th:replace="~{index :: .navbar}"></nav>
    <div class="container" style="padding: 2rem 1rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h2>Truyện Của Tôi (<span th:text="${stories.size()}">0</span>)</h2>
            <a th:href="@{/uploader/stories/new}" class="btn btn-primary" style="background: #10b981; color: white;">
                <i class="fas fa-plus"></i> Đăng Truyện Mới
            </a>
        </div>
        
        <div th:if="${success}" style="background: #d1fae5; color: #065f46; border: 1px solid #10b981; padding: 1rem; border-radius: 8px; margin-bottom: 1rem;" th:text="${success}"></div>
        <div th:if="${error}" style="background: #fee2e2; color: #991b1b; border: 1px solid #ef4444; padding: 1rem; border-radius: 8px; margin-bottom: 1rem;" th:text="${error}"></div>

        <div style="background: white; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
            <table style="width: 100%; text-align: left; border-collapse: collapse;">
                <thead style="background: #f8fafc; border-bottom: 1px solid #e2e8f0;">
                    <tr>
                        <th style="padding: 1rem; font-weight: 600; color: #475569;">Bìa</th>
                        <th style="padding: 1rem; font-weight: 600; color: #475569;">Tên Truyện</th>
                        <th style="padding: 1rem; font-weight: 600; color: #475569;">Trạng Thái</th>
                        <th style="padding: 1rem; font-weight: 600; color: #475569; text-align: right;">Hành Động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(stories)}">
                        <td colspan="4" style="padding: 2rem; text-align: center; color: #64748b;">Bạn chưa đăng truyện nào.</td>
                    </tr>
                    <tr th:each="story : ${stories}" style="border-bottom: 1px solid #f1f5f9;">
                        <td style="padding: 1rem; width: 80px;">
                            <img th:if="${story.coverImage}" th:src="${story.coverImage}" style="width: 50px; height: 75px; object-fit: cover; border-radius: 4px;" alt="Bìa">
                        </td>
                        <td style="padding: 1rem; font-weight: 500; color: #1e293b;">
                            <a th:href="@{/story/{slug}(slug=${story.slug})}" style="color: inherit; text-decoration: none;" th:text="${story.title}">Tên truyện</a>
                            <div style="font-size: 0.8rem; color: #94a3b8; font-weight: normal; margin-top: 4px;" th:text="${story.author}">Tác giả</div>
                        </td>
                        <td style="padding: 1rem;">
                            <span style="background: #dbeafe; color: #1d4ed8; padding: 0.25rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600;" th:text="${story.status}">Trạng thái</span>
                        </td>
                        <td style="padding: 1rem; text-align: right;">
                            <a th:href="@{/uploader/stories/{id}/chapters/new(id=${story.id})}" class="btn" style="background: #3b82f6; color: white; padding: 0.4rem 0.8rem; font-size: 0.85rem;"><i class="fas fa-plus"></i> Thêm Chương</a>
                            <form th:action="@{/uploader/stories/delete/{id}(id=${story.id})}" method="post" style="display: inline-block; margin: 0;" onsubmit="return confirm('Bạn có chắc chắn muốn xóa truyện này? Hành động này không thể hoàn tác.');">
                                <button type="submit" class="btn" style="background: white; border: 1px solid #ef4444; color: #ef4444; padding: 0.4rem 0.8rem; font-size: 0.85rem;"><i class="fas fa-trash-alt"></i> Xóa</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
