<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Chương Mới - WebDocTruyen</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Summernote Editor cho nội dung -->
    <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.css" rel="stylesheet">
</head>
<body style="background: #f8fafc;">
    <nav class="navbar" th:replace="~{index :: .navbar}"></nav>
    <div class="container" style="padding: 2rem 1rem; max-width: 900px; margin: 0 auto;">
        <div style="background: white; border-radius: 12px; padding: 2.5rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid #f1f5f9;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 2px solid #f1f5f9; padding-bottom: 1rem;">
                <h2 style="margin: 0; color: #1e293b; font-size: 1.5rem;"><i class="fas fa-file-circle-plus" style="color: #3b82f6;"></i> Thêm Chương Mới</h2>
                <a th:href="@{/uploader/stories}" style="color: #64748b; text-decoration: none; font-size: 0.9rem;"><i class="fas fa-arrow-left"></i> Quay lại Danh sách</a>
            </div>

            <form th:action="@{/uploader/stories/{storyId}/chapters/new(storyId=${storyId})}" th:object="${chapter}" method="post">
                <div style="margin-bottom: 1.5rem; display: flex; gap: 1.5rem;">
                    <div style="flex: 1; max-width: 150px;">
                        <label style="display: block; font-weight: 600; color: #475569; margin-bottom: 0.5rem;">Số Chương *</label>
                        <input type="number" step="0.1" th:field="*{chapterNumber}" required style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; outline: none;">
                    </div>
                    <div style="flex: 1;">
                        <label style="display: block; font-weight: 600; color: #475569; margin-bottom: 0.5rem;">Tiêu Đề Chương</label>
                        <input type="text" th:field="*{title}" placeholder="Ví dụ: Sự khởi đầu" style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; outline: none;">
                    </div>
                </div>

                <div style="margin-bottom: 2rem;">
                    <label style="display: block; font-weight: 600; color: #475569; margin-bottom: 0.5rem;">Nội Dung Chương *</label>
                    <textarea id="chapterContent" th:field="*{content}" required rows="15" placeholder="Nhập nội dung chương ở đây..." style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; outline: none; line-height: 1.6;"></textarea>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
                    <a th:href="@{/uploader/stories}" class="btn" style="background: white; border: 1px solid #cbd5e1; color: #64748b; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 600;">Hủy</a>
                    <button type="submit" class="btn btn-primary" style="background: #3b82f6; padding: 0.75rem 2rem; border-radius: 8px; font-weight: 600; box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3);">Đăng Chương</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#chapterContent').summernote({
                placeholder: 'Soạn thảo nội dung chương...',
                tabsize: 2,
                height: 400,
                toolbar: [
                    ['style', ['style']],
                    ['font', ['bold', 'underline', 'clear']],
                    ['color', ['color']],
                    ['para', ['ul', 'ol', 'paragraph']],
                    ['insert', ['link', 'picture', 'video']],
                    ['view', ['fullscreen', 'codeview', 'help']]
                ]
            });
        });
    </script>
</body>
</html>
